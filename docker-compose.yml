services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: help_desk_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/help_desk
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-super-secret-key-123456}
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  postgres:
    image: postgres:16-alpine
    container_name: help_desk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: help_desk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d help_desk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
